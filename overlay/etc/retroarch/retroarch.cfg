# =============================================================================
# RetroArch — Configuration GameStick Lite 4K (RK3032, 256 Mo RAM)
# =============================================================================
 
# --- Chemins ---
libretro_directory = "/mnt/sdcard/libretro"
libretro_info_path = "/usr/share/retroarch/info"
content_directory = "/mnt/sdcard/roms"
savefile_directory = "/mnt/sdcard/saves"
savestate_directory = "/mnt/sdcard/saves"
system_directory = "/mnt/sdcard/system"
assets_directory = "/usr/share/retroarch/assets"
rgui_browser_directory = "/mnt/sdcard/roms"
playlist_directory = "/mnt/sdcard/playlists"
core_options_path = "/mnt/sdcard/config/retroarch-core-options.cfg"
 
# --- Vidéo ---
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_max_swapchain_images = "2"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_font_size = "18"
video_msg_pos_x = "0.02"
video_msg_pos_y = "0.98"
 
# --- Audio ---
audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_rate_control = "true"
audio_rate_control_delta = "0.005"
 
# --- Input (manettes 2.4 GHz du GameStick) ---
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_exit_emulator = "escape"
input_menu_toggle_gamepad_combo = "6"
# Combo = Start + Select pour ouvrir le menu
 
# --- Interface ---
menu_driver = "rgui"
# RGUI = le plus léger, adapté aux 256 Mo de RAM
rgui_show_start_screen = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
 
# --- Performance (critique avec 256 Mo) ---
video_threaded = "false"
audio_enable = "true"
rewind_enable = "false"
# Désactiver le rewind : économise beaucoup de RAM
savestate_auto_save = "false"
savestate_auto_load = "false"
 
# --- Réseau ---
network_cmd_enable = "false"
stdin_cmd_enable = "false"
 
# --- Scanner de contenu ---
content_database_path = "/usr/share/retroarch/database/rdb"
cheat_database_path = "/usr/share/retroarch/database/cht"
cursor_directory = "/usr/share/retroarch/database/cursors"
 
# --- Logging ---
log_verbosity = "true"
